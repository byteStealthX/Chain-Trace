services:
  # Backend Service
  - type: web
    name: chain-trace-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Frontend Service
  - type: static
    name: chain-trace-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: chain-trace-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';"


  # Cron Job (Daily Fraud Scan)
  - type: cron
    name: daily-fraud-scan
    env: node
    rootDir: backend
    schedule: "0 0 * * *" # Runs daily at midnight
    buildCommand: npm install
    startCommand: node cron/dailyScan.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
